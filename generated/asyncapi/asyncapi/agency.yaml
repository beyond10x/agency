operations:
  send.agency.agents.AgentDefinitionCreated:
    action: send
    channel:
      $ref: '#/channels/agency.agents.AgentDefinitionCreated'
    title: Publish AgentDefinitionCreated
    summary: Publishes `agency.agents.AgentDefinitionCreated`.
    description: |-
      Nothing in this specification reacts to `agency.agents.AgentDefinitionCreated`.
      `agency.agents.CreateAgentDefinition` emits it on `created`, which creates a `agency.agents.AgentDefinition` in `Draft`. It carries the new instance's identity in `definition_id`.
    messages:
    - $ref: '#/channels/agency.agents.AgentDefinitionCreated/messages/agency.agents.AgentDefinitionCreated'
  send.agency.agents.AgentDefinitionDeprecated:
    action: send
    channel:
      $ref: '#/channels/agency.agents.AgentDefinitionDeprecated'
    title: Publish AgentDefinitionDeprecated
