  title: agency
  version: v1
  description: |-
    `agency` in the `agency` specification.

    The Agency service and cockpit API (docs/design/agency.md §5.1-§5.2).

    The deployable service and cockpit from which an agentic engineer defines agents, gives them tools and credentials, forms them into teams, feeds them work, and watches the runs Loom executes for them (docs/design/agency.md §1).

    The specification declares no transport, so each address below is a name and not a topic on a named broker. Servers, protocol bindings, security schemes, message keys, partitioning, retention and ordering are absent because the model does not state them.
