    description: |-
      Nothing in this specification reacts to `agency.agents.AgentDefinitionDeprecated`.
      `agency.agents.DeprecateAgentDefinition` emits it on `deprecated`, which moves a `agency.agents.AgentDefinition` to `Deprecated` along `deprecate`.
