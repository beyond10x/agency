name: check

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: agency / task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess and aep
        env:
          ESS_VERSION: "0.72.0"
          ESS_SHA256: 4fd09de042ec6220a3ed9ed9e07d2f7deb91f1fdb20c998340d5c8e224ec3f11
          AEP_VERSION: "0.77.1"
          AEP_SHA256: 24121f808c52b5c76904ba03516229f748e3a5ab7a195552ad7d45c90d0714b2
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/b10x-bin"
          mkdir -p "$bin"
          for tool in "ess:$ESS_VERSION:$ESS_SHA256" "aep:$AEP_VERSION:$AEP_SHA256"; do
            IFS=: read -r name version sha <<< "$tool"
            asset="$name-$version-x86_64-unknown-linux-gnu.tar.gz"
            release="https://github.com/beyond10x/$name/releases/download/$version"
            dir="$RUNNER_TEMP/$name-dl"
            mkdir -p "$dir"
            curl --fail --silent --show-error --location --output "$dir/$asset" "$release/$asset"
            curl --fail --silent --show-error --location --output "$dir/SHA256SUMS" "$release/SHA256SUMS"
            grep -Fx "$sha  $asset" "$dir/SHA256SUMS"
            (cd "$dir" && grep -F "  $asset" SHA256SUMS | sha256sum --check --strict)
            tar -xzf "$dir/$asset" -C "$dir"
            find "$dir" -type f -name "$name" -perm -u+x -exec cp {} "$bin/" \;
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: task check
        run: task check
