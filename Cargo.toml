[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["generated/rust/agency"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/agency"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
ess-conformance = { git = "https://github.com/beyond10x/ess.git", tag = "0.74.0" }
ess-primitives = { git = "https://github.com/beyond10x/ess.git", tag = "0.74.0" }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
